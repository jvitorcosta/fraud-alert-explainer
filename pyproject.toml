[project]
name = "fraud-alert-explainer"
version = "0.1.0"
description = "LightGBM card-fraud model with SHAP-grounded, LLM-written alert explanations, on public simulated data."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "João Vitor Pinheiro" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28",
    "lightgbm>=4.6",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.3",
    "pyarrow>=21",
    "scikit-learn>=1.7",
    "shap>=0.48",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.30",
    "mypy>=1.18",
    "pandas-stubs>=2.3",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "N",        # pep8-naming
    "PTH",      # use pathlib
    "S",        # bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# No type stubs published for these.
module = ["lightgbm.*", "shap.*", "sklearn.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fraud_alert_explainer"]
branch = true
# Thin I/O entry points: exercised by `make train` / `make explain`, not unit tests.
omit = ["*/__main__.py", "*/pipeline.py", "*/charts.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
